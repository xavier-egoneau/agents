[project]
name = "agentic-markdown-kernel"
version = "0.1.0"
description = "A Markdown-first modular multi-agent kernel"
requires-python = ">=3.12"
dependencies = [
  "anthropic==0.108.0",
  "fastapi==0.133.1",
  "httpx==0.28.1",
  "keyring==25.7.0",
  "pydantic==2.12.5",
  "pydantic-ai-harness==0.9.0",
  "pydantic-ai-slim[anthropic,openai]==2.14.1",
  "pyyaml==6.0.3",
  "typer==0.21.0",
  "uvicorn==0.41.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
  "pytest-httpx==0.36.0",
  "ruff==0.15.0",
]

[project.scripts]
amk = "agentic_kernel.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_kernel"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: opt-in tests that call real model providers"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
