name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: surfaces/web/package-lock.json
      - run: uv sync --extra dev --locked
      - run: npm ci --prefix surfaces/web
      - run: npx --prefix surfaces/web playwright install --with-deps chromium
      - run: ./scripts/check.sh
